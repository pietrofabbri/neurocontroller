# Pubblica la versione web (la talpa) su GitHub Pages, solo dopo che le prove passano.
# Sul sito non c'e' il server locale: la pagina salva le partite nel browser di chi gioca (web/05-talpa-w0.md).
# PRIMA VOLTA: Settings -> Pages -> Source = "GitHub Actions" (il token del workflow non puo' attivare Pages).
# Si pubblica SOLO web/app (senza la cartella test). Nessun segreto e nessun dato personale coinvolti.
name: Pubblica la talpa

on:
  push:
    branches: [main]
    paths: ["web/app/**", "neurocontroller/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests
      - run: python tools/check_repo.py

  pubblica:
    needs: prove
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il sito (senza le prove)
        run: |
          mkdir _sito
          cp -r web/app/. _sito/
          rm -rf _sito/test
          touch _sito/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sito
      - id: deploy
        uses: actions/deploy-pages@v4
